<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Defect Tracker</title>
    <!-- STABLE STYLING: Tailwind CSS v3 Play CDN -->
    <script src="https://tailwindcss.com"></script>
    <!-- STABLE DATABASE: Supabase JS Library -->
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen pb-10">

    <!-- Header -->
    <header class="bg-red-600 text-white p-4 sticky top-0 shadow-md z-10">
        <h1 class="text-xl font-bold text-center">🏗️ Site Defect Monitor</h1>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-6">
        
        <!-- Report Form -->
        <section class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
            <h2 class="text-lg font-semibold mb-3 text-gray-800">Log New Defect</h2>
            <form id="defectForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Capture/Upload Image</label>
                    <input type="file" id="imageInput" accept="image/*" capture="environment" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-red-50 file:text-red-700 hover:file:bg-red-100" required>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                    <textarea id="descriptionInput" rows="2" class="w-full p-2 border border-gray-300 rounded-md focus:ring-red-500 focus:border-red-500 text-sm" placeholder="What is the defect?" required></textarea>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Initial Status</label>
                        <select id="statusInput" class="w-full p-2 border border-gray-300 rounded-md bg-white text-sm">
                            <option value="Pending">🔴 Pending</option>
                            <option value="In Progress">🟡 In Progress</option>
                            <option value="Resolved">🟢 Resolved</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Location / Area</label>
                        <input type="text" id="locationInput" class="w-full p-2 border border-gray-300 rounded-md text-sm focus:ring-red-500 focus:border-red-500" placeholder="e.g., Block B, Room 4" required>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-red-600 text-white py-2.5 rounded-md font-semibold text-sm shadow hover:bg-red-700 transition">
                    Submit Defect
                </button>
            </form>
        </section>

        <!-- Live Feed Section -->
        <section>
            <h2 class="text-lg font-semibold mb-3 text-gray-800 flex items-center justify-between">
                <span>Active Defects</span>
                <span class="inline-flex h-2 w-2 rounded-full bg-green-500 animate-ping"></span>
            </h2>
            <div id="defectList" class="space-y-4">
                <p class="text-gray-500 text-sm text-center py-4">Loading live dashboard feed...</p>
            </div>
        </section>
    </main>

    <script>
        // Initialize Supabase (Replace with your actual keys)
        const SUPABASE_URL = 'https://lsamqbrmuwzzrmxbnblz.supabase.co/rest/v1/';
        const SUPABASE_KEY = 'sb_publishable_UHtKtwKM73rVEvqnWU7Ejg_6H4Hz_sl';
        
        // Use the global object format for UMD fallback stability
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const form = document.getElementById('defectForm');
        const locationInput = document.getElementById('locationInput');
        const defectList = document.getElementById('defectList');

        // Helper to get color classes based on status string
        function getStatusBadge(status) {
            if (status === 'In Progress') return 'bg-amber-100 text-amber-800 border-amber-200';
            if (status === 'Resolved') return 'bg-emerald-100 text-emerald-800 border-emerald-200';
            return 'bg-rose-100 text-rose-800 border-rose-200'; // Default to Pending
        }

        // 1. Submit data (Image upload + Form row insertion)
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "Uploading...";

            const file = document.getElementById('imageInput').files[0];
            const description = document.getElementById('descriptionInput').value;
            const status = document.getElementById('statusInput').value;
            const location = locationInput.value;

            try {
                // Upload Image to Supabase Bucket
                const fileName = `${Date.now()}_${file.name}`;
                const { data: uploadData, error: uploadError } = await supabase.storage
                    .from('defect-images')
                    .upload(fileName, file);

                if (uploadError) throw uploadError;

                // Get Public Image URL
                const { data: urlData } = supabase.storage.from('defect-images').getPublicUrl(fileName);
                const imageUrl = urlData.publicUrl;

                // Insert Log Row into Database
                const { error: insertError } = await supabase
                    .from('defects')
                    .insert([{ description, location, image_url: imageUrl, status }]);

                if (insertError) throw insertError;

                form.reset();
                alert("Defect logged successfully!");
            } catch (err) {
                console.error(err);
                alert("Error saving data: " + err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Defect";
            }
        });

        // 2. Update Status Function (Triggered by changing the dropdown on a card)
        async function updateStatus(id, newStatus) {
            const { error } = await supabase
                .from('defects')
                .update({ status: newStatus })
                .eq('id', id);
            
            if (error) {
                alert("Failed to update status: " + error.message);
            }
        }

        // 3. Fetch and Render Defects List
        async function loadDefects() {
            try {
                const { data, error } = await supabase
                    .from('defects')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                
                if (!data || data.length === 0) {
                    defectList.innerHTML = `<p class="text-gray-500 text-sm text-center py-4">No defects logged yet. Site is clear!</p>`;
                    return;
                }

                defectList.innerHTML = data.map(defect => {
                    const badgeClass = getStatusBadge(defect.status);
                    return `
                        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col">
                            <div class="relative">
                                <img src="${defect.image_url}" alt="Defect" class="w-full h-48 object-cover bg-gray-100">
                                <span class="absolute top-3 right-3 text-xs font-semibold px-2.5 py-1 rounded-full border shadow-sm ${badgeClass}">
                                    ${defect.status}
                                </span>
                            </div>
                            <div class="p-4 space-y-3">
                                <p class="text-gray-800 text-sm font-medium">${defect.description}</p>
                                
                                <div class="flex items-center justify-between border-t border-gray-100 pt-3">
                                    <div class="flex flex-col text-[11px] text-gray-500">
                                        <span>📍 ${defect.location}</span>
                                        <span>${new Date(defect.created_at).toLocaleDateString()} ${new Date(defect.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                                    </div>
                                    
                                    <!-- Status Changer Dropdown for Engineers -->
                                    <div>
                                        <select onchange="updateStatus('${defect.id}', this.value)" class="text-xs bg-gray-50 border border-gray-300 text-gray-700 py-1 px-2 rounded focus:outline-none focus:ring-1 focus:ring-red-500">
                                            <option value="Pending" ${defect.status === 'Pending' ? 'selected' : ''}>Set: Pending</option>
                                            <option value="In Progress" ${defect.status === 'In Progress' ? 'selected' : ''}>Set: In Progress</option>
                                            <option value="Resolved" ${defect.status === 'Resolved' ? 'selected' : ''}>Set: Resolved</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
